<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamilyBridge - Reminders &amp; Routines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#A0C4FF",
            "accent": "#FFBF69",
            "background-light": "#F8F9FA",
            "background-dark": "#101c22",
            "card-light": "#FFFFFF",
            "card-dark": "#1a2831",
            "text-primary-light": "#111618",
            "text-primary-dark": "#F8F9FA",
            "text-secondary-light": "#617c89",
            "text-secondary-dark": "#a0b3bd",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-text-primary-light dark:text-text-primary-dark flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-text-primary-light dark:text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Reminders &amp; Routines</h2>
<div class="flex size-12 shrink-0 items-center"></div>
</div>
<div class="flex flex-col gap-4 p-4">
<div class="flex items-center gap-4 bg-card-light dark:bg-card-dark rounded-xl px-4 min-h-[72px] py-3 shadow-sm">
<div class="flex items-center gap-4 flex-grow">
<div class="text-text-primary-light dark:text-text-primary-dark flex items-center justify-center rounded-lg bg-primary/30 shrink-0 size-12">
<span class="material-symbols-outlined">pill</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal line-clamp-1">Take medicine</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal line-clamp-2">8:00 AM, Daily</p>
</div>
</div>
<div class="flex items-center gap-2">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-background-light dark:bg-background-dark p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
<button class="text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
<div class="flex items-center gap-4 bg-card-light dark:bg-card-dark rounded-xl px-4 min-h-[72px] py-3 shadow-sm">
<div class="flex items-center gap-4 flex-grow">
<div class="text-text-primary-light dark:text-text-primary-dark flex items-center justify-center rounded-lg bg-primary/30 shrink-0 size-12">
<span class="material-symbols-outlined">directions_walk</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal line-clamp-1">Morning walk</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal line-clamp-2">9:00 AM, Mon, Wed, Fri</p>
</div>
</div>
<div class="flex items-center gap-2">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-background-light dark:bg-background-dark p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
<button class="text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
<div class="flex items-center gap-4 bg-card-light dark:bg-card-dark rounded-xl px-4 min-h-[72px] py-3 shadow-sm">
<div class="flex items-center gap-4 flex-grow">
<div class="text-text-primary-light dark:text-text-primary-dark flex items-center justify-center rounded-lg bg-primary/30 shrink-0 size-12">
<span class="material-symbols-outlined">cardiology</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-text-primary-light dark:text-text-primary-dark text-base font-medium leading-normal line-clamp-1">Check blood pressure</p>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal line-clamp-2">10:00 AM, Daily</p>
</div>
</div>
<div class="flex items-center gap-2">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-background-light dark:bg-background-dark p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
<button class="text-text-secondary-light dark:text-text-secondary-dark">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>

        <h3 class="text-lg font-semibold text-text-primary-light dark:text-text-primary-dark">No reminders yet</h3>

<div class="fixed bottom-6 right-6">
<button class="flex items-center justify-center h-16 w-16 rounded-full bg-accent text-white shadow-lg transform transition-transform hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
</div>
</body></html>
