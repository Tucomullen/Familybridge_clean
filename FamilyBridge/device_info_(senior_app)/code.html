<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Device Information</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13a4ec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                        "warm-gray": "#4a4a4a",
                        "soft-green": "#6ee7b7",
                        "warm-yellow": "#fde047"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="flex items-center bg-background-light dark:bg-background-dark p-6 pb-4 justify-between sticky top-0">
<div class="text-warm-gray dark:text-white flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-4xl">arrow_back</span>
</div>
<h1 class="text-warm-gray dark:text-white text-3xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Device Information</h1>

<div class="flex flex-col gap-4 p-6 pt-2">

<div class="flex items-center gap-6">
<div class="text-warm-gray dark:text-white flex items-center justify-center rounded-lg bg-background-light dark:bg-gray-800 shrink-0 size-14">
<span class="material-symbols-outlined text-4xl">wifi</span>
</div>
<p class="text-warm-gray dark:text-white text-2xl font-medium leading-normal flex-1 truncate">Wi-Fi Connection</p>
</div>
<div class="flex items-center gap-2 shrink-0">
<div class="size-4 rounded-full bg-soft-green"></div>
<p class="text-warm-gray dark:text-white text-2xl font-normal leading-normal">Connected</p>
</div>
</div>
<div class="flex items-center gap-6 bg-white dark:bg-background-dark rounded-xl p-5 min-h-20 justify-between">
<div class="flex items-center gap-6">
<div class="text-warm-gray dark:text-white flex items-center justify-center rounded-lg bg-background-light dark:bg-gray-800 shrink-0 size-14">
<span class="material-symbols-outlined text-4xl">signal_cellular_alt</span>
</div>
<p class="text-warm-gray dark:text-white text-2xl font-medium leading-normal flex-1 truncate">Signal Strength</p>
</div>
<div class="flex items-center gap-2 shrink-0">
<div class="size-4 rounded-full bg-soft-green"></div>
<p class="text-warm-gray dark:text-white text-2xl font-normal leading-normal">Good</p>
</div>
</div>
<div class="flex items-center gap-6 bg-white dark:bg-background-dark rounded-xl p-5 min-h-20 justify-between">
<div class="flex items-center gap-6">
<div class="text-warm-gray dark:text-white flex items-center justify-center rounded-lg bg-background-light dark:bg-gray-800 shrink-0 size-14">
<span class="material-symbols-outlined text-4xl">battery_5_bar</span>
</div>
<p class="text-warm-gray dark:text-white text-2xl font-medium leading-normal flex-1 truncate">Battery Level</p>
</div>
<div class="shrink-0">
<p class="text-warm-gray dark:text-white text-2xl font-normal leading-normal">85%</p>
</div>
</div>
<div class="flex items-center gap-6 bg-white dark:bg-background-dark rounded-xl p-5 min-h-20 justify-between">
<div class="flex items-center gap-6">
<div class="text-warm-gray dark:text-white flex items-center justify-center rounded-lg bg-background-light dark:bg-gray-800 shrink-0 size-14">
<span class="material-symbols-outlined text-4xl">info</span>
</div>
<p class="text-warm-gray dark:text-white text-2xl font-medium leading-normal flex-1 truncate">App Version</p>
</div>
<div class="shrink-0">
<p class="text-warm-gray dark:text-white text-2xl font-normal leading-normal">1.2.3</p>
</div>
</div>
<div class="flex items-center gap-6 bg-white dark:bg-background-dark rounded-xl p-5 min-h-20 justify-between">
<div class="flex items-center gap-6">
<div class="text-warm-gray dark:text-white flex items-center justify-center rounded-lg bg-background-light dark:bg-gray-800 shrink-0 size-14">
<span class="material-symbols-outlined text-4xl">phone_iphone</span>
</div>
<p class="text-warm-gray dark:text-white text-2xl font-medium leading-normal flex-1 truncate">Device Model</p>
</div>
<div class="shrink-0">
<p class="text-warm-gray dark:text-white text-2xl font-normal leading-normal">iPhone 13</p>
</div>
</div>
</div>
</div>
