<!DOCTYPE html>

<html class="light" lang="en"><head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13a4ec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                        "warm-orange": "#f97316",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111618] dark:text-white">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-[#111618] dark:text-white flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-[#111618] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">FamilyBridge</h2>
<div class="flex size-12 shrink-0 items-center"></div>
</div>
<div class="flex flex-col items-center justify-center flex-grow p-4">
<h1 class="text-[#111618] dark:text-white tracking-light text-[32px] font-bold leading-tight px-4 text-center pb-3 pt-6">Connect with your family</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pb-6 pt-1 px-4 text-center">Share this code with a family member to connect, or scan their QR code.</p>
<div class="flex justify-center px-4 py-3">
<fieldset class="relative flex gap-2 sm:gap-4">
<input class="flex h-16 w-12 sm:h-20 sm:w-16 text-center [appearance:textfield] focus:outline-0 focus:ring-0 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none rounded-xl border-2 border-transparent bg-white dark:bg-background-dark dark:border-slate-700 focus:border-2 focus:border-primary text-2xl sm:text-3xl font-bold" max="9" maxlength="1" min="0" type="number" value="1"/>
<input class="flex h-16 w-12 sm:h-20 sm:w-16 text-center [appearance:textfield] focus:outline-0 focus:ring-0 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none rounded-xl border-2 border-transparent bg-white dark:bg-background-dark dark:border-slate-700 focus:border-2 focus:border-primary text-2xl sm:text-3xl font-bold" max="9" maxlength="1" min="0" type="number" value="2"/>
<input class="flex h-16 w-12 sm:h-20 sm:w-16 text-center [appearance:textfield] focus:outline-0 focus:ring-0 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none rounded-xl border-2 border-transparent bg-white dark:bg-background-dark dark:border-slate-700 focus:border-2 focus:border-primary text-2xl sm:text-3xl font-bold" max="9" maxlength="1" min="0" type="number" value="3"/>
<input class="flex h-16 w-12 sm:h-20 sm:w-16 text-center [appearance:textfield] focus:outline-0 focus:ring-0 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none rounded-xl border-2 border-transparent bg-white dark:bg-background-dark dark:border-slate-700 focus:border-2 focus:border-primary text-2xl sm:text-3xl font-bold" max="9" maxlength="1" min="0" type="number" value="4"/>
<input class="flex h-16 w-12 sm:h-20 sm:w-16 text-center [appearance:textfield] focus:outline-0 focus:ring-0 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none rounded-xl border-2 border-transparent bg-white dark:bg-background-dark dark:border-slate-700 focus:border-2 focus:border-primary text-2xl sm:text-3xl font-bold" max="9" maxlength="1" min="0" type="number" value="5"/>
<input class="flex h-16 w-12 sm:h-20 sm:w-16 text-center [appearance:textfield] focus:outline-0 focus:ring-0 [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none rounded-xl border-2 border-transparent bg-white dark:bg-background-dark dark:border-slate-700 focus:border-2 focus:border-primary text-2xl sm:text-3xl font-bold" max="9" maxlength="1" min="0" type="number" value="6"/>
</fieldset>
</div>
<div class="my-6 flex items-center justify-center w-full px-8">
<div class="h-px bg-slate-300 dark:bg-slate-700 flex-grow"></div>
<span class="px-4 text-slate-500 dark:text-slate-400 text-sm">OR</span>
<div class="h-px bg-slate-300 dark:bg-slate-700 flex-grow"></div>
</div>
<div class="flex w-full max-w-xs grow bg-background-light dark:bg-background-dark @container p-4 justify-center">
<div class="w-48 h-48 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-md flex items-center justify-center">
<img class="w-full h-full" data-alt="QR code for pairing devices" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOUs8mfHRusmzYoBvpudaw3O_VBMAgKLi9bVeqYsBCYP2V-DqL8dCTq9rkydgORg1qZgPxMCaY5A-LkoXvloGo58sJnC1cwrpvXbfTriIvRHPqe-pccSapTNKAGDbVTRJVNj5FO0AG7qW8Gf29TL5iM74HMEHOL4ncwrVkHP1gEHhnTIPgofOpqdFEv4z-s3ot3wTcDdXpEs0lmyNjfSwv5AghIuyAGc7u3BJC-8zNQ5jAxpT6TILjq3u1XBeXLM9YvOyEf1QkOxk"/>
</div>
</div>
</div>
<div class="p-4 space-y-4 bg-background-light dark:bg-background-dark">
<button class="w-full flex items-center justify-center gap-2 bg-primary text-white font-bold py-4 px-6 rounded-xl text-lg hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined">share</span>
            Share Code
        </button>
<button class="w-full flex items-center justify-center gap-2 bg-warm-orange text-white font-bold py-4 px-6 rounded-xl text-lg hover:bg-warm-orange/90 transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
            Scan QR
        </button>
</div>
</div>
</body></html>
