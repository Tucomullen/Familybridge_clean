<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FamilyBridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13a4ec",
              "background-light": "#F7F9FC",
              "background-dark": "#101c22",
              "app-background": "#F7F9FC",
              "sos-accent": "#E63946",
              "call-accent": "#4CAF50",
              "photos-accent": "#2196F3",
              "message-accent": "#FF9800",
              "text-dark": "#1C1C1E",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.5rem",
              "lg": "1rem",
              "xl": "1.5rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 1,
          'wght' 400,
          'GRAD' 0,
          'opsz' 48;
      }
    </style>
<style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-app-background font-display">
<div class="relative flex h-screen min-h-screen w-full flex-col group/design-root overflow-hidden">
<div class="flex items-center p-6 pb-4 justify-between">
<div class="w-12"></div>
<h1 class="text-text-dark text-3xl font-bold tracking-tight text-center flex-1">FamilyBridge</h1>
<div class="flex w-12 items-center justify-end">
<button class="flex items-center justify-center rounded-full h-12 w-12 bg-white/50 text-text-dark">
<span class="material-symbols-outlined text-3xl">settings</span>
</button>
</div>
</div>
<main class="flex-1 flex flex-col items-center justify-center p-4">
<div class="w-full max-w-md mb-8">
<div class="bg-white/70 rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-5xl text-yellow-500">sunny</span>
<div>
<p class="text-text-dark text-4xl font-bold">72°</p>
<p class="text-text-dark/70 text-lg">Sunny</p>
</div>
</div>
<div class="text-right">
<p class="text-text-dark text-lg font-bold">Tomorrow</p>
<p class="text-text-dark/70 text-lg">75° / Partly Cloudy</p>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-8 w-full max-w-md">
<div class="flex flex-col items-center gap-2">
<button class="flex flex-col items-center justify-center w-36 h-36 rounded-xl bg-call-accent shadow-lg">
<span class="material-symbols-outlined text-white !text-7xl">call</span>
</button>
<span class="text-text-dark text-xl font-bold">Call</span>
</div>
<div class="flex flex-col items-center gap-2">
<button class="flex flex-col items-center justify-center w-36 h-36 rounded-xl bg-photos-accent shadow-lg">
<span class="material-symbols-outlined text-white !text-7xl">photo_library</span>
</button>
<span class="text-text-dark text-xl font-bold">Photos</span>
</div>
<div class="flex flex-col items-center gap-2 col-span-2 justify-self-center">
<button class="flex flex-col items-center justify-center w-36 h-36 rounded-xl bg-message-accent shadow-lg">
<span class="material-symbols-outlined text-white !text-7xl">message</span>
</button>
<span class="text-text-dark text-xl font-bold">Message</span>
</div>
</div>
</main>
<footer class="p-6 pt-4 flex justify-center">
<div class="flex flex-col items-center gap-2">
<button class="flex flex-col items-center justify-center w-28 h-28 rounded-full bg-sos-accent shadow-lg">
<span class="material-symbols-outlined text-white !text-6xl">sos</span>
</button>
<span class="text-text-dark text-lg font-bold">SOS</span>
</div>
</footer>
</div>

</body></html>
